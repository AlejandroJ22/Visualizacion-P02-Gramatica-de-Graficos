[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viz-canarias"
version = "0.1.0"
description = "Visualización de distribución de rentas en Canarias usando Dagster y plotnine"
authors = [{name = "Alejandro"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "plotnine>=0.12.0",
    "dagster>=1.5.0",
    "dagster-webserver>=1.5.0",
    "openpyxl>=3.1.0",
]

[tool.dagster]
module_name = "viz_dagster"
